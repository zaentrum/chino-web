name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The organisation's shared neutrality check.
  neutrality-shared:
    permissions:
      contents: read
    uses: zaentrum/.github/.github/workflows/neutrality.yml@v1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24: the unit tests are TypeScript run by node --test directly, which
          # needs a Node that strips types by itself (22.18+); 20 cannot.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t chino-web:ci .
